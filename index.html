<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Video Player</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }
        html, body {
            height: 100%;
            width: 100%;
            overflow: hidden;
            font-family: Arial, Helvetica, sans-serif;
        }

        /* 3D Title Style */
        .video-title {
            position: absolute;
            top: 30px;
            left: 50%;
            transform: translateX(-50%);
            width: 100%;
            text-align: center;
            font-size: clamp(2rem, 8vw, 4.5rem);
            font-weight: 900;
            color: #ffffff;
            text-shadow: 
                3px 3px 0 #ff4081,
                6px 6px 0 #2196f3,
                10px 10px 15px rgba(0,0,0,0.7);
            letter-spacing: 1px;
            z-index: 10;
        }

        video {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            object-fit: contain;
        }
    </style>
</head>
<body>
    <h1 class="video-title">To my Olivia, I need my Wet Fun</h1>

    <video 
        src="1.mp4"
        autoplay
        muted
        controls
        playsinline
    >
        Your browser does not support the video tag.
    </video>
</body>
</html>
